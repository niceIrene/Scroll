# The scroll evaluation harness: reference agent loops (base_agent_A /
# scroll_react), the BEAM and Terminal-Bench benchmarks, and the Harbor
# sandbox orchestration. A uv workspace member that depends on the
# scroll-context package from the repo root; never published.
[project]
name = "scroll-eval"
version = "0.1.0"
description = "Evaluation harness for scroll-context: reference agents, BEAM, Terminal-Bench (Harbor)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "scroll-context",
    "e2b<2.25.0",
    "harbor>=0.8.0",
    "agentscope>=2.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "openai>=1.40.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "arize-phoenix-otel>=0.6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# BEAM LLM-as-judge grading (scroll_eval.evals.beam.judge): scipy for
# Kendall-tau (event_ordering) and json_repair for tolerant JSON parsing of
# judge output.
beam = [
    "scipy>=1.11",
    "json-repair>=0.25",
]

[project.scripts]
scroll-eval = "scroll_eval.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scroll_eval*"]

[tool.uv.sources]
scroll-context = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
