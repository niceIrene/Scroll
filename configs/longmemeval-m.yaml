# LongMemEval "m" split (~1.5M-token haystacks; same 500 question ids as the
# s split, so it lives in its own task dir). dataset.name selects the split:
# the runner reads local-tasks/<dataset.name>/. Materialize the tasks first:
#
#   curl -L -o external/longmemeval/data/longmemeval_m_cleaned.json \
#     https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_m_cleaned.json
#   uv run python scripts/gen_longmemeval_tasks.py \
#     --src external/longmemeval/data/longmemeval_m_cleaned.json \
#     --dataset longmemeval-m --limit 0
#
# Then: uv run scroll-eval longmemeval configs/longmemeval-m.yaml
agent: { type: base_agents, id: scroll_react }
model:
  endpoint: ${OPENAI_BASE_URL}
  name: ${OPENAI_MODEL_NAME}
  api_key_env: OPENAI_API_KEY
  thinking: true        # DashScope reasoning mode: true to enable (default off)
  thinking_budget: 4000  # optional cap on reasoning tokens when thinking is on
dataset: { type: local, name: longmemeval-m }
tasks: all
budget: { max_tokens: 2000000, wall_time_s: 600 }   # per probe (one agent.run)
memory: { history_max_tokens: 32000 }               # small window -> forces retrieval
trace: { run_id: auto, phoenix_project: longmemeval-m }
tools: [execute_python, submit_answer]            # no bash: LME needs no shell
