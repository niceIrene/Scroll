[project]
name = "scroll-context"
version = "0.1.0"
description = "Scroll: context management for LLM agents — durable write-through history, token-bounded windows with an in-context eviction index, and code-driven retrieval (ms) via a persistent REPL. Public API: ScrollContextManager."
readme = "README.md"
# Looser than the evaluation harness's 3.12 pin: the shipped modules run on
# 3.10. Do not add 3.12-only syntax under src/ without bumping this.
requires-python = ">=3.10"
dependencies = [
    # memoryspace.py imports opentelemetry.trace unguarded; the api package is
    # lightweight and no-ops without a configured SDK.
    "opentelemetry-api>=1.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["scroll_context", "scroll_context._runtime"]

[tool.setuptools.package-data]
# The model-facing prompt protocol is data, not modules — ship the markdown so
# a non-editable install still finds it (scroll_context.prompts reads them).
"scroll_context" = ["*.md"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.6.0",
]

# The evaluation harness (agents, BEAM, Terminal-Bench/Harbor) lives in
# evaluation/ as a separate, never-published workspace member — its heavy
# dependencies stay out of this package.
[tool.uv.workspace]
members = ["evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
