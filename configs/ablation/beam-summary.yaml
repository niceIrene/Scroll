# Ablation arm 1b — ROLLING-SUMMARY BASELINE (no DB access, no REPL): the
# classic incremental-summarization memory agent. The seeded conversation is
# folded chunk-by-chunk into ONE continuation summary (QwenPaw's "en"
# continuation-summary template: initial then update mode), then a single QA
# call answers from the summary ALONE — the model never sees the raw
# transcript at answer time. Compare against beam-longctx.yaml: same
# no-DB/no-REPL posture, but lossy fixed-size summary memory instead of
# recency-truncated prompt stuffing.
#
# history_max_tokens does not bind in this arm (the QA prompt is the summary,
# capped at 4000 tokens by the template); it is kept for config parity. The
# arm-specific knob is SCROLL_SUMMARY_CHUNK_TOKENS (summarizer per-call input,
# default 50000; changing it invalidates the summary cache).
#
# Cost: the seed summary is computed ONCE per task and cached next to the seed
# DB (<db>.summary.json) — sibling probes reuse it, so per-probe cost is one QA
# call after the first probe. wall_time_s is enforced between summarization
# calls; a probe past the deadline answers from the partial summary and is
# marked terminated=budget.
# tools: listed only to satisfy select_tools; this agent is plain-text and
# ignores ctx.tools.
agent: { type: base_agents, id: summary_baseline }
model:
  endpoint: ${OPENAI_BASE_URL}
  name: ${OPENAI_MODEL_NAME}
  api_key_env: OPENAI_API_KEY
  thinking: true
  thinking_budget: 4000
dataset: { type: local, name: beam }
tasks: all
budget: { max_tokens: 4000000, wall_time_s: 600 }   # per probe (one agent.run)
memory: { history_max_tokens: 500000 }              # unused here; parity only
trace: { run_id: auto, phoenix_project: beam-ablation }
tools: [submit_answer]
