# BEAM long-term-memory benchmark (100K tier), run natively against the scroll
# agent. NOT a Harbor dataset — drive it with `scroll-eval beam configs/beam.yaml`
# (the `scroll-eval run` Harbor path refuses dataset.name == "beam").
#
# The conversation is ingested into the agent's durable memory; each probe runs
# as its own session and the agent answers via ms.search retrieval. The small
# history_max_tokens is the memory-pressure knob: a 100K-token conversation
# cannot fit the window, so the agent must retrieve. Raise it to relax the test.
agent: { type: base_agents, id: scroll_react }
model:
  endpoint: ${OPENAI_BASE_URL}
  name: ${OPENAI_MODEL_NAME}
  api_key_env: OPENAI_API_KEY
  thinking: true # DashScope reasoning mode: true to enable (default off)
  thinking_budget: 4000 # optional cap on reasoning tokens when thinking is on
dataset: { type: local, name: beam }
tasks: all
budget: { max_tokens: 4000000, wall_time_s: 600 } # per probe (one agent.run)
memory: { history_max_tokens: 256000 } # small window -> forces retrieval
trace: { run_id: auto, phoenix_project: beam }
tools: [execute_python, submit_answer] # no bash: BEAM needs no shell
