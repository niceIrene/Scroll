# Ablation arm 1 — LONG-CONTEXT BASELINE (no DB access, no REPL): the BEAM
# paper's "vanilla long-context" baseline as an agent. The seeded conversation
# transcript is stuffed into the prompt; when it exceeds the budget, the
# EARLIEST turns are dropped (recency truncation). Single-shot: one LLM call,
# no tools. See beam-scroll.yaml for the delta map.
#
# history_max_tokens here is the PROMPT-STUFFING budget (same knob, arm-specific
# semantics: it is the eviction budget in the scroll arms). Override with
# SCROLL_LONGCTX_MAX_TOKENS if the serving model's real window is smaller.
# tools: listed only to satisfy select_tools; this agent is single-shot
# plain-text and ignores ctx.tools.
agent: { type: base_agents, id: longctx_baseline }
model:
  endpoint: ${OPENAI_BASE_URL}
  name: ${OPENAI_MODEL_NAME}
  api_key_env: OPENAI_API_KEY
  thinking: true
  thinking_budget: 4000
dataset: { type: local, name: beam }
tasks: all
budget: { max_tokens: 4000000, wall_time_s: 600 }   # per probe (one agent.run)
memory: { history_max_tokens: 500000 }              # prompt-stuffing budget
trace: { run_id: auto, phoenix_project: beam-ablation }
tools: [submit_answer]
